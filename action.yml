name: 'Checkout'
description: 'Checkout a Git repo using --reference'
inputs:
  repository:
    description: |
      GitHub repository name (e.g., owner/repo) or direct HTTPS Git repository URL (e.g., https://git.example.com/repo.git).
      Other transports are not supported; credentials in the url are refused - pass a token instead.
      Default: GITHUB_REPOSITORY
  token:
    description: |
      A token to fetch the repository.
      Typically, you would use GITHUB_TOKEN
  common-path:
    description: |
      Common (reference) git repo path, relative to GITHUB_WORKSPACE or
      absolute. An absolute path outside the workspace is supported.
      Default: ${repository}.git
  path:
    description: |
      Where to place the repository, relative to GITHUB_WORKSPACE or absolute.
      An absolute path outside the workspace is supported - on Windows the
      default workspace can be too deep for a large checkout.
  ref:
    description: |
      A branch, tag, full ref (refs/tags/v1) or SHA to checkout. Pass a full
      ref when a branch and a tag share a name; a short name resolves to the
      branch.
      Default: the ref the workflow runs on
  clean:
    description: 'Whether to clean working directory or not'
    default: true
runs:
  using: 'composite'
  steps:
    - shell: bash
      # Inputs arrive through the environment and are never spliced into the
      # script source: an expression expanded here would be parsed as shell
      # code, and a path or ref may hold quotes or spaces.
      env:
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_COMMON_PATH: ${{ inputs.common-path }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_CLEAN: ${{ inputs.clean }}
        GITHUB_TOKEN: ${{ inputs.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        REPO=$INPUT_REPOSITORY
        REF_DIR=$INPUT_COMMON_PATH
        TARGET_DIR=$INPUT_PATH
        TARGET_REF=$INPUT_REF
        CLEAN=$INPUT_CLEAN

        REPO=${REPO:-$GITHUB_REPOSITORY}
        [ ! "$TARGET_DIR" ] && CLEAN=

        # The full ref is passed on, not a short name: refs/tags/x and
        # refs/heads/x are different things that share a name, and
        # github.ref_name would flatten them into one. It also reads
        # "9/merge" on a pull request, which is not the name the merge ref is
        # fetched under.
        if [ "$TARGET_DIR" ] && [ -z "$TARGET_REF" ]; then
          case "$GITHUB_REF" in
            refs/heads/* | refs/tags/* | refs/pull/*) TARGET_REF=$GITHUB_REF ;;
            *) TARGET_REF=$GITHUB_SHA ;;
          esac
        fi

        if [[ "$REPO" == https://* ]]; then
          REPO_URL="$REPO"
          SAFE_REPO_NAME="${REPO#*://}"
        else
          REPO_URL="https://github.com/$REPO"
          SAFE_REPO_NAME="$REPO"
        fi

        REF_DIR=${REF_DIR:-$SAFE_REPO_NAME.git}

        cmd=(bash "$ACTION_PATH/git-checkout.sh" --debug --repo "$REPO_URL" --ref-dir "$REF_DIR")
        [ "$TARGET_DIR" ] && cmd+=(--target-dir "$TARGET_DIR")
        [ "$TARGET_REF" ] && cmd+=(--target-ref "$TARGET_REF")
        [ "$CLEAN" == "true" ] && cmd+=(--clean)

        printf '%q ' "${cmd[@]}"; echo
        "${cmd[@]}"
