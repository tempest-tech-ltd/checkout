name: 'Checkout'
description: 'Checkout a Git repo using --reference'
inputs:
  repository:
    description: |
      GitHub repository name (e.g., owner/repo) or direct Git repository URL (e.g., https://git.example.com/repo.git)
      Default: GITHUB_REPOSITORY
  token:
    description: |
      A token to fetch the repository.
      Typically, you would use GITHUB_TOKEN.
      It is left in the checkout's config, the way actions/checkout leaves its
      credentials behind, so that later steps of the job can push. It is never
      written into the common (reference) repo, which every job on the runner
      shares.
  common-path:
    description: |
      Common (reference) git repo path under GITHUB_WORKSPACE
      Default: ${repository}.git
  path:
    description: |
      Relative path under GITHUB_WORKSPACE to place the repository.
      An absolute path outside the workspace is supported - on Windows the
      default workspace can be too deep for a large checkout.
  ref:
    description: |
      A branch, tag or SHA to checkout. A name is looked up on the remote
      only: a branch resolves to origin/<name> and a local branch of that
      name never stands in for it.
      Default: github.ref_name
  clean:
    description: |
      Whether to clean working directory or not.
      Tracked files match the checked out commit either way; clean also
      removes untracked and ignored files, build output included.
runs:
  using: 'composite'
  steps:
    - shell: bash
      # Inputs arrive through the environment and are never spliced into the
      # script source: an expression expanded into it would be parsed as
      # shell code, and a path or a ref may hold spaces or quotes.
      env:
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_COMMON_PATH: ${{ inputs.common-path }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_CLEAN: ${{ inputs.clean }}
        DEFAULT_REF: ${{ github.ref_name }}
        GITHUB_TOKEN: ${{ inputs.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        REPO=$INPUT_REPOSITORY
        REF_DIR=$INPUT_COMMON_PATH
        TARGET_DIR=$INPUT_PATH
        TARGET_REF=$INPUT_REF
        CLEAN=$INPUT_CLEAN

        REPO=${REPO:-$GITHUB_REPOSITORY}
        [ "$TARGET_DIR" ] && TARGET_REF=${TARGET_REF:-$DEFAULT_REF}
        [ ! "$TARGET_DIR" ] && CLEAN=

        if [[ "$REPO" == https://* ]]; then
          REPO_URL="$REPO"
          SAFE_REPO_NAME="${REPO#*://}"
        else
          REPO_URL="https://github.com/$REPO"
          SAFE_REPO_NAME="$REPO"
        fi

        REF_DIR=${REF_DIR:-$SAFE_REPO_NAME.git}

        cmd=(bash "$ACTION_PATH/git-checkout.sh" --debug --repo "$REPO_URL" --ref-dir "$REF_DIR")
        [ "$TARGET_DIR" ] && cmd+=(--target-dir "$TARGET_DIR")
        [ "$TARGET_REF" ] && cmd+=(--target-ref "$TARGET_REF")
        [ "$CLEAN" == "true" ] && cmd+=(--clean)

        printf '%q ' "${cmd[@]}"; echo
        "${cmd[@]}"
