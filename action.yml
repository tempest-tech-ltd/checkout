name: 'Checkout'
description: 'Checkout a Git repo using --reference'
inputs:
  repository:
    description: |
      GitHub full repo name
      Default: GITHUB_REPOSITORY
  token:
    description: |
      A token to fetch the repository.
      Typically, you would use GITHUB_TOKEN
  common-path:
    description: |
      Common (reference) git repo path under GITHUB_WORKSPACE
      Default: ${repository}.git
  path:
    description: 'Relative path under GITHUB_WORKSPACE to place the repository'
  ref:
    description: |
      A branch, tag or SHA to checkout
      Default: github.ref_name
  clean:
    description: 'Whether to clean working directory or not'
    default: true
runs:
  using: 'composite'
  steps:
    - shell: bash
      run: |
        REPO=${{ inputs.repository }}
        REF_DIR=${{ inputs.common-path }}
        TARGET_DIR=${{ inputs.path }}
        TARGET_REF=${{ inputs.ref }}
        CLEAN=${{ inputs.clean }}

        GITHUB_REF=${{ github.ref_name }}
        GITHUB_ACTION_PATH='${{ github.action_path }}'

        REPO=${REPO:-$GITHUB_REPOSITORY}
        [ "$TARGET_DIR" ] && TARGET_REF=${TARGET_REF:-$GITHUB_REF}
        [ ! "$TARGET_DIR" ] && CLEAN=

        # Validate and sanitize repository URL
        validate_url() {
          local url="$1"
          
          # Check for allowed protocols (https, http, git)
          if [[ ! "$url" =~ ^(https?|git):// ]]; then
            echo "Error: Invalid protocol. Only https://, http://, and git:// are allowed."
            exit 1
          fi
          
          # Check for basic URL format validation
          # Ensure no dangerous characters that could lead to command injection
          if [[ "$url" =~ [\;\|\&\$\`\(\)\<\>] ]]; then
            echo "Error: URL contains potentially dangerous characters."
            exit 1
          fi
          
          # Validate URL structure - should have a domain/host after protocol
          # Allow alphanumeric, dots, hyphens in hostname, optional port, and safe path characters
          if [[ ! "$url" =~ ^(https?|git)://[a-zA-Z0-9][a-zA-Z0-9\.\-]+(:[0-9]+)?(/[^[:space:]]+)?$ ]]; then
            echo "Error: URL format is invalid. Expected format: protocol://host[:port][/path]"
            exit 1
          fi
        }

        if [[ "$REPO" == https://* ]] || [[ "$REPO" == http://* ]] || [[ "$REPO" == git://* ]]; then
          validate_url "$REPO"
          REPO_URL="$REPO"
          SAFE_REPO_NAME="${REPO#*://}"
        else
          REPO_URL="https://github.com/$REPO"
          SAFE_REPO_NAME="$REPO"
        fi

        REF_DIR=${REF_DIR:-$SAFE_REPO_NAME.git}

        try_remove_locks() {
          local dir="$1"
          if [ -d "$dir" ]; then
            rm -f "$dir/index.lock" "$dir/HEAD.lock" "$dir/config.lock" || true
          fi
        }

        try_remove_locks "$REF_DIR"
        [ "$TARGET_DIR" ] && try_remove_locks "$TARGET_DIR/.git"

        CMD="bash '$GITHUB_ACTION_PATH'/git-checkout.sh --debug --repo '$REPO_URL' --ref-dir '$REF_DIR'"
        [ "$TARGET_DIR" ] && CMD="$CMD --target-dir '$TARGET_DIR'"
        [ "$TARGET_REF" ] && CMD="$CMD --target-ref '$TARGET_REF'"
        [ "$CLEAN" == "true" ] && CMD="$CMD --clean"
        echo $CMD

        eval $CMD
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
